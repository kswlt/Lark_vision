# RM CONTROL — Docker Compose（单容器，Mock 零配置默认）
#
# 用法：
#   docker compose up -d --build   首次构建并启动（Mock 模式，无需任何配置文件）
#   docker compose up -d           已有镜像时启动 / 应用配置变更
#   访问 http://localhost:8080
#
# 接真实飞书（不需要修改本文件）：
#   1. cp backend/.env.example backend/.env
#   2. 在 backend/.env 填写飞书凭证并设 DATA_SOURCE=feishu
#   3. docker compose up -d
#   backend/.env 通过 env_file 注入容器；文件不存在时静默跳过，使用镜像内置默认值（Mock）。
#
# 自定义队伍配置（不需要修改本文件）：
#   1. cp backend/config/team.example.yaml backend/config/team.yaml 并修改队伍信息
#   2. cp compose.override.yaml.example compose.override.yaml
#   3. docker compose up -d   （compose 自动合并 override，挂载 team.yaml）
#
# 启用摄像头（不需要修改本文件）：在 backend/.env 设 CAMERA_ENABLED=true 及相关参数。
services:
  rm-control:
    build: .
    container_name: rm-control
    restart: unless-stopped
    ports:
      - "8080:8080"
    # backend/.env 不存在时忽略（required: false），容器回落到镜像内 ENV 默认值：
    #   DATA_SOURCE=mock / CAMERA_ENABLED=false  -> 零配置即可看到完整 Dashboard。
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # 容器内固定监听地址与端口（与 ports 映射一致）。
      # 业务配置（DATA_SOURCE / CAMERA_* / FEISHU_* / ADMIN_TOKEN / VIEWER_TOKEN 等）
      # 一律来自 backend/.env，避免此处覆盖用户配置。
      HOST: 0.0.0.0
      PORT: "8080"
