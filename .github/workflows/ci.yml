name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  backend:
    name: Backend (ruff / pytest / compileall)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install core dependencies
        run: pip install -r requirements.txt
      - name: Install test tooling
        run: pip install pytest ruff
      - name: Ruff check
        run: ruff check app.py services config data camera_checkin.py camera_manager.py integrations tests
      - name: Pytest
        env:
          # CI 不依赖真实飞书账号 / 相机 / Secret / 网络
          DATA_SOURCE: mock
          FEISHU_WORKTIME_SOURCE: mock
        run: python -m pytest -q
      - name: Compile check
        run: python -m compileall -q app.py services config data camera_checkin.py camera_manager.py integrations tests
