name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  backend:
    name: Backend (ruff / pytest / compileall / smoke)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install core dependencies
        run: pip install -r requirements.txt
      - name: Install test tooling
        run: pip install pytest ruff
      - name: Ruff check
        run: ruff check app.py services config data camera_checkin.py camera_manager.py integrations tests
      - name: Pytest
        env:
          DATA_SOURCE: mock
          FEISHU_WORKTIME_SOURCE: mock
        run: python -m pytest -q
      - name: Compile check
        run: python -m compileall -q app.py services config data camera_checkin.py camera_manager.py integrations tests
      - name: Smoke test (start backend + hit /api/health)
        env:
          DATA_SOURCE: mock
          CAMERA_ENABLED: "false"
          PORT: 8080
        shell: bash
        run: |
          python app.py &
          SERVER_PID=$!
          sleep 4
          curl -sf http://127.0.0.1:8080/api/health | tee /tmp/health.json
          curl -sf http://127.0.0.1:8080/api/meta > /dev/null
          curl -sf http://127.0.0.1:8080/api/tasks > /dev/null
          curl -sf http://127.0.0.1:8080/api/dashboard > /dev/null
          # camera 无 token 必须 401
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/camera/status)
          if [ "$CODE" != "401" ]; then echo "camera/status expected 401, got $CODE"; exit 1; fi
          kill $SERVER_PID 2>/dev/null || true

  docker:
    name: Docker (build + compose up + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (YAML schema 校验)
        run: docker compose config > /dev/null
      - name: Build image
        run: docker build -t rm-control:ci .
      - name: docker compose up
        run: docker compose up -d --build
      - name: Wait for healthy + smoke
        run: |
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/health || true)
            if [ "$CODE" = "200" ]; then echo "healthy after ${i} checks"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/health || { echo "=== container logs ==="; docker compose logs; exit 1; }
          curl -sf http://127.0.0.1:8080/api/tasks > /dev/null
          curl -sf http://127.0.0.1:8080/api/dashboard > /dev/null
          curl -sf http://127.0.0.1:8080/api/meta > /dev/null
      - name: docker compose down
        if: always()
        run: docker compose down -v
